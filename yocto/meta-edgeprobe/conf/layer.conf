BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "edgeprobe"
BBFILE_PATTERN_edgeprobe = "^${LAYERDIR}/"
BBFILE_PRIORITY_edgeprobe = "10"
LAYERDEPENDS_edgeprobe = "core"
LAYERSERIES_COMPAT_edgeprobe = "scarthgap"

# Repo root (this layer lives in <repo>/yocto/meta-edgeprobe). The recipe
# builds the checked-out commit from here, so Yocto and the cargo matrix
# build exactly the same source.
EDGEPROBE_SRCDIR := "${@os.path.normpath('${LAYERDIR}/../..')}"
